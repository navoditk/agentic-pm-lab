inputs:
  learner_request:
    type: string
  topic_id:
    type: string
    required: false
# This skill invokes no Cedar-governed Tool Layer capability. Reading repository
# sources, asking the learner a question, and tracking session progress are
# harness capabilities, not runtime tools -- the same category as skill-creator's
# apply_patch and skill-tester's bash, which check_skill_contracts.py exempts via
# the meta-skill rule. They were previously listed here as if they were governed
# tools; no such tools exist anywhere in src/ or scripts/.
allowed_tools: []
forbidden_tools:
  - investment_advice
  - order_execution
  - live_provider_invocation
  - credential_access
  - repository_editing
output_schema:
  type: object
  required:
    - lesson_or_assessment
    - citations
    - limitations
# The one write: on the learner's explicit request, a quiz they answered in the
# conversation is appended to their own gitignored attempt log through the same
# CLI a terminal learner uses. Nothing version-controlled is touched, which is
# what repository_editing below forbids.
side_effects: >-
  On explicit learner request only, appends one quiz attempt to the gitignored
  data/learner_progress/<topic-id>.jsonl via `agentic-pm-lab quiz --answers`.
  No tracked file is modified.
approval_required: false
covers:
  - src/education/tutor.py
  - docs/learning/tutor-courses.json
  - docs/learning/tutors
  - evals/tutor_quizzes
version: 1.0.0
