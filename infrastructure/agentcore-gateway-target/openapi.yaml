openapi: 3.0.1
info:
  title: Agentic PM Lab read-only target
  version: 1.0.0
  description: Public/mock-data read-only endpoints exposed as governed AgentCore Gateway tools.
servers:
  - url: https://{restApiId}.execute-api.{region}.amazonaws.com/{stage}
    variables:
      restApiId: {default: replace-me}
      region: {default: us-west-2}
      stage: {default: lab}
paths:
  /portfolio/risk:
    get:
      operationId: getPortfolioRisk
      description: Read mock portfolio exposures and risk flags for a portfolio identifier.
      parameters:
        - name: portfolio_id
          in: query
          required: false
          schema: {type: string, default: PORT_A}
      responses:
        '200': {description: Portfolio risk snapshot}
  /market/curve:
    get:
      operationId: getMarketCurve
      description: Read a point-in-time mock USD curve used for deterministic analysis.
      responses:
        '200': {description: Curve points}
  /research/evidence:
    get:
      operationId: getResearchEvidence
      description: Read a small point-in-time mock research evidence record.
      responses:
        '200': {description: Research evidence}
