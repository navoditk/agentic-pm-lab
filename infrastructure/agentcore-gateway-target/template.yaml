AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only HTTPS API target for the Agentic PM Lab AgentCore Gateway exercise.

Parameters:
  StageName:
    Type: String
    Default: lab
    AllowedPattern: '[a-zA-Z0-9_-]+'

Resources:
  GatewayTargetRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Fn::Sub: '${AWS::StackName}-rest-api'
      EndpointConfiguration:
        Types:
          - REGIONAL
      Body:
        Fn::Sub: |
          {
            "openapi": "3.0.1",
            "info": {"title": "Agentic PM Lab read-only target", "version": "1.0.0", "description": "Public/mock-data read-only endpoints exposed as governed AgentCore Gateway tools."},
            "schemes": ["https"],
            "paths": {
              "/portfolio/risk": {"get": {"operationId": "getPortfolioRisk", "description": "Read mock portfolio exposures and risk flags.", "parameters": [{"name": "portfolio_id", "in": "query", "required": false, "schema": {"type": "string", "default": "PORT_A"}}], "security": [{"sigv4": []}], "responses": {"200": {"description": "Portfolio risk snapshot"}}, "x-amazon-apigateway-integration": {"type": "mock", "requestTemplates": {"application/json": "{\\\"statusCode\\\": 200}"}, "responses": {"default": {"statusCode": "200", "responseTemplates": {"application/json": "{\\\"portfolio_id\\\": \\\"PORT_A\\\", \\\"as_of\\\": \\\"2026-08-13\\\", \\\"status\\\": \\\"mock_public_learning_data\\\", \\\"exposures\\\": {\\\"rates\\\": 0.42, \\\"credit\\\": 0.33, \\\"cash\\\": 0.25}, \\\"risk_flags\\\": [\\\"credit concentration requires review\\\"]}"}}}}}},
              "/market/curve": {"get": {"operationId": "getMarketCurve", "description": "Read a point-in-time mock USD curve.", "security": [{"sigv4": []}], "responses": {"200": {"description": "Curve points"}}, "x-amazon-apigateway-integration": {"type": "mock", "requestTemplates": {"application/json": "{\\\"statusCode\\\": 200}"}, "responses": {"default": {"statusCode": "200", "responseTemplates": {"application/json": "{\\\"as_of\\\": \\\"2026-08-13\\\", \\\"source\\\": \\\"mock_public_learning_data\\\", \\\"currency\\\": \\\"USD\\\", \\\"points\\\": [{\\\"tenor_years\\\": 2, \\\"rate_pct\\\": 4.10}, {\\\"tenor_years\\\": 5, \\\"rate_pct\\\": 4.02}, {\\\"tenor_years\\\": 10, \\\"rate_pct\\\": 4.15}]}"}}}}}},
              "/research/evidence": {"get": {"operationId": "getResearchEvidence", "description": "Read a point-in-time mock research evidence record.", "security": [{"sigv4": []}], "responses": {"200": {"description": "Research evidence"}}, "x-amazon-apigateway-integration": {"type": "mock", "requestTemplates": {"application/json": "{\\\"statusCode\\\": 200}"}, "responses": {"default": {"statusCode": "200", "responseTemplates": {"application/json": "{\\\"as_of\\\": \\\"2026-08-13\\\", \\\"source_type\\\": \\\"mock_public_research\\\", \\\"evidence\\\": [{\\\"id\\\": \\\"E-GW-001\\\", \\\"topic\\\": \\\"credit outlook\\\", \\\"stance\\\": \\\"mixed\\\"}]}"}}}}}}
            },
            "components": {"securitySchemes": {"sigv4": {"type": "apiKey", "name": "Authorization", "in": "header", "x-amazon-apigateway-authtype": "awsSigv4"}}},
            "x-amazon-apigateway-endpoint-configuration": {"disableExecuteApiEndpoint": false}
          }

  GatewayTargetDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: GatewayTargetRestApi
    Properties:
      RestApiId:
        Ref: GatewayTargetRestApi
      Description:
        Fn::Sub: 'Read-only AgentCore Gateway target ${AWS::StackName}'

  GatewayTargetStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: GatewayTargetRestApi
      DeploymentId:
        Ref: GatewayTargetDeployment
      StageName:
        Ref: StageName
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

Outputs:
  RestApiId:
    Value:
      Ref: GatewayTargetRestApi
  StageName:
    Value:
      Ref: GatewayTargetStage
  HttpsBaseUrl:
    Value:
      Fn::Sub: 'https://${GatewayTargetRestApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
