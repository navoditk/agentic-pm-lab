name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # Formatting was enforced only by pre-commit, which sees staged files
      # only -- so when ruff began formatting Python inside markdown fences,
      # four tutor docs drifted on main with nothing to catch them.
      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Documentation consistency
        run: uv run python scripts/check_docs_consistency.py

      - name: Tutor course completeness
        run: uv run python scripts/check_tutor_courses.py

      - name: Quiz bank integrity
        run: uv run python scripts/check_quiz_banks.py

      - name: Generated learning-path tables
        run: uv run python scripts/build_learning_path.py --check

      - name: Curriculum source registry
        run: uv run python scripts/check_curriculum_sources.py

      - name: Generated learning curriculum
        run: uv run python scripts/build_learning_curriculum.py --check

      - name: Document line-range index
        run: uv run python scripts/build_plan_index.py --check

      - name: Documentation links and anchors
        run: uv run python scripts/check_doc_links.py

      - name: Set up Node (the page quiz test runs its script)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test (pytest)
        run: uv run pytest
