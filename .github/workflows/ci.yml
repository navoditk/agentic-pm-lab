name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Documentation consistency
        run: uv run python scripts/check_docs_consistency.py

      - name: Tutor course completeness
        run: uv run python scripts/check_tutor_courses.py

      - name: Curriculum source registry
        run: uv run python scripts/check_curriculum_sources.py

      - name: Generated learning curriculum
        run: uv run python scripts/build_learning_curriculum.py --check

      - name: Test (pytest)
        run: uv run pytest
