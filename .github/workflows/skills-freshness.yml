name: Skills Freshness

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Check skill freshness
        run: >-
          uv run python scripts/check_skills_freshness.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
