name: Progress Tracker Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Regenerate PROGRESS.md
        run: uv run python scripts/check_progress.py

      - name: Fail if PROGRESS.md is stale
        run: |
          git diff --exit-code -- PROGRESS.md
