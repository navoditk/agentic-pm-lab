name: Morning Portfolio Review

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5" # 08:30 America/New_York; review DST as needed

permissions:
  contents: read
  issues: write

jobs:
  approval-only-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Generate deterministic review artifact
        run: |
          mkdir -p artifacts
          uv run python - <<'PY'
          from scripts.artifacts_host import generate_risk_summary
          print(generate_risk_summary())
          PY
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-portfolio-review-${{ github.run_id }}
          path: artifacts/portfolio-risk-summary.html
          if-no-files-found: error
          retention-days: 7
      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > morning-brief.md <<'EOF'
          ## Approval-only morning portfolio review

          This issue contains a public/mock learning artifact generated by the
          agentic-pm-lab workflow. It is not investment advice and does not place
          trades. A human must review provenance, freshness, entitlements, and
          any proposed follow-up before taking action.

          - Artifact: `artifacts/portfolio-risk-summary.html`
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Prompt: `.github/prompts/morning-portfolio-review.prompt.md`

          Close this issue after review; do not use it as an execution approval.
          EOF
          gh issue create --title "Morning portfolio review — $(date -u +%Y-%m-%d)" --body-file morning-brief.md --label "portfolio-review" || gh issue create --title "Morning portfolio review — $(date -u +%Y-%m-%d)" --body-file morning-brief.md
