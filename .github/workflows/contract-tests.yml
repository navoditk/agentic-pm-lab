name: Skill Contracts

on:
  pull_request:
    branches: [main]
    paths: ["skills/**", "contracts/**", "governance/**", "scripts/**", ".github/workflows/contract-tests.yml"]
  push:
    branches: [main]
    paths: ["skills/**", "contracts/**", "governance/**", "scripts/**", ".github/workflows/contract-tests.yml"]
  workflow_dispatch:
  # The path filters above mean this only runs when someone happens to touch a
  # watched directory. A contract can therefore drift and stay green for weeks:
  # agentic-pm-mastery declared three non-existent tools from d21f3cd until an
  # unrelated docs PR touched skills/ and surfaced it (#45). The weekly run
  # catches that class of drift without waiting for a coincidence.
  schedule:
    - cron: "0 11 * * 1" # Weekly Monday 11:00 UTC, an hour after curriculum-freshness

permissions:
  contents: read

jobs:
  schema-static-mock-negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Schema and static contract checks
        run: uv run python scripts/check_skill_contracts.py
      - name: Mock execution and negative tests
        run: uv run pytest skills -q
      - name: Governance negative tests
        run: uv run pytest governance/tests -q
      - name: Application contract tests
        run: uv run pytest tests/unit/mcp_server tests/unit/analytics/test_contracts.py -q
