[project]
name = "agentic-pm-lab"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Navodit Kaushik", email = "navoditk@yahoo.co.in" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "bedrock-agentcore>=1.21.0",
    "boto3>=1.43.67",
    "cedarpy>=4.8.7",
    "deepagents>=0.7.5",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fredapi>=0.5.2",
    "jsonschema>=4.26.0",
    "langsmith>=0.10.17",
    "mcp>=2.0.0",
    "openai>=2.53.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "pyportfolioopt>=1.6.0",
    "pyyaml>=6.0.3",
    "statsmodels>=0.14.6",
    "streamlit>=1.61.1",
    "tiktoken>=0.13.0",
    "uvicorn>=0.52.1",
    "yfinance>=1.5.2",
]

[project.scripts]
agentic-pm-lab = "agentic_pm_lab:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.16.2",
]
