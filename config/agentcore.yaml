# Deployment intent for Day 12. Resource creation remains an explicit AWS
# exercise; review this file before running any AgentCore CLI command.
runtime:
  deployment_mode: direct_code
  entrypoint: src.runtime.agentcore_app:app
  region: us-west-2
  model_env: AGENTCORE_MODEL
gateway:
  protocol: MCP
  target: src.mcp_server.server:create_mcp_server
  governed_path_only: true
identity:
  source: AgentCore Identity
  local_equivalent: config/roles.yaml
policy:
  source: AgentCore Policy
  local_equivalent:
    - governance/policies/tool-permissions.cedar
    - governance/policies/portfolio-access.cedar
guardrails:
  mode: minimal_day_12
  source: Amazon Bedrock Guardrails
observability:
  source: OpenTelemetry and AgentCore Observability
  cloud_destination: CloudWatch
teardown:
  required_after_demo: true
