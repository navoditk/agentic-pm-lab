services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m src.mcp_server.server
    env_file: .env
    stdin_open: true
    volumes:
      - .:/workspace
    working_dir: /workspace

  artifacts:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python scripts/artifacts_host.py
    ports:
      - "8765:8765"
    volumes:
      - .:/workspace
    working_dir: /workspace

  streamlit:
    profiles: [ui]
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    working_dir: /workspace
